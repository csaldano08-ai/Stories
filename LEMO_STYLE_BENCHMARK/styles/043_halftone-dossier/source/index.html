<!-- 043 · Halftone Dossier — the first 10 s of "Last Train Home" read out as a case file, one exhibit at a time (lemo-opuscar
     styles/halftone-dossier). Cream archive paper, overprinted halftone dots in flat inks, heavy slab headlines with a
     misregistered shadow, a caption bar with the keyword in the highlight ink, rubber stamps that slam, a thick-outlined
     character. The page skeleton, helpers, halftone, caption, stamp, scene, dot wipe, paper and grain are the demo's engine
     (copied; marked below); the case, the exhibits and the character are this clip's.
       EXHIBIT 01 · THE PUDDLE (0–2.5)   she runs through the café's puddle; on the splash (0.9375 s) a SPLASH! starburst and a shake
       ─ dot wipe ─
       EXHIBIT 02 · THE RUN (2.5–7.5)    side view, the ground's dots scroll under her locked feet, the shop chips pass, halftone dots
                                         crowd the frame edge as the clock runs; 6.05–7.15 she lifts the watch: "!?"
       ─ dot wipe ─
       EXHIBIT 03 · THE WATCH (7.5–9.4)  a flash (being photographed), the watch as evidence: 23:58, the red second hand ticking
       ─ hard cut ─
       VERDICT (9.4–10)                  the station clock; the stamp LAST TRAIN slams on the chime (9.575 s) with a shake and a flash
     AKI is a chunky, thick-outlined figure posed by the shared run rig (constant limb lengths, foot lock); line boil at 10 fps on
     her only. Page contract: window.render(t), DUR, READY, RIGQA. -->

const SPL = RUN.contacts.find(c => Math.abs(c.t0 - EV.splash) < .02);

function render(t) {

  for (const [t0, a, d] of SHAKES) if (t >= t0 && t < t0 + d) { const k = 1 - (t - t0) / d; dx += a * k * k * Math.sin(t * 91 + t0); dy += a * k * k * Math.cos(t * 77 + t0 * 3); }
